name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check version
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if echo "$CURRENT" | grep -qi "snapshot"; then
              echo "Version is SNAPSHOT, skipping release"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "Manual trigger: releasing $CURRENT"
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
            fi
          else
            PREVIOUS=$(git show HEAD~1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version" 2>/dev/null || echo "")
            echo "Previous version: $PREVIOUS"
            if [ "$CURRENT" != "$PREVIOUS" ] && [ -n "$PREVIOUS" ] && ! echo "$CURRENT" | grep -qi "snapshot"; then
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
            else
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Upload npm debug log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-log
          path: /home/runner/.npm/_logs/
          retention-days: 7

      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" --generate-notes --title "v${VERSION}"

      - name: Bump to next SNAPSHOT version
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          NEXT=$(node -p "const v = '${VERSION}'.split('.'); v[2] = parseInt(v[2]) + 1; v.join('.') + '-SNAPSHOT'")
          echo "Next development version: $NEXT"
          npm version "$NEXT" --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Bump version to ${NEXT} [skip ci]"
          git push
